name: Release utilities
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  utility-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q download_model.py infer.py tests
      - name: Run small offline tests
        run: python -m unittest discover -s tests -v
